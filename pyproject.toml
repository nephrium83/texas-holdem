[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdem"
version = "1.1.0"
description = "Texas Hold'em with a Godot client, Python rules engine, and mental-poker P2P protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adam LeRoux" }]
keywords = ["poker", "texas-holdem", "godot", "python", "peer-to-peer", "cryptography", "game"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
dependencies = ["Pillow>=10.0", "cryptography>=41.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.3,<3",
]

[project.urls]
Repository = "https://github.com/nephrium83/texas-holdem"

[project.gui-scripts]
holdem = "holdem.gui:main"

[tool.setuptools]
packages = ["holdem", "holdem.p2p"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: name every non-passing outcome and its reason in the run summary.
# CI runs `pytest -q`, which reports a bare "N skipped" -- and the suites
# that skip themselves when libsodium is missing are the ones carrying the
# mental-poker security properties. A count cannot tell "Godot is not
# installed" from "the entire crypto estate did not run". See
# tests/crypto_gate.py.
addopts = "-ra"
