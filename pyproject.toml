[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holdem"
version = "1.2.0"
description = "Texas Hold'em with a Godot client, Python rules engine, and mental-poker P2P protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Adam LeRoux" }]
keywords = ["poker", "texas-holdem", "godot", "python", "peer-to-peer", "cryptography", "game"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]
# The embeddable rules, player views, and local table API use only the
# standard library. Host applications choose the adapters they need.
dependencies = []

[project.optional-dependencies]
desktop = [
    "Pillow>=10.0",
    "cryptography>=41.0",
]
p2p = [
    "cryptography>=41.0",
]
internet = [
    # Optional host adapter only; the portable rules/API need no WebRTC stack.
    "aiortc==1.15.0",
    "aioice==0.10.2",
    "websockets==16.1.1",
]
introducer = [
    "cryptography>=41.0",
    "websockets==16.1.1",
]
dev = [
    # Keep the existing full application test environment available via [dev].
    "Pillow>=10.0",
    "cryptography>=41.0",
    "pytest>=7.0",
    "pytest-timeout>=2.3,<3",
    # Parse manually dispatched workflow YAML before shipping acceptance tools.
    "PyYAML>=6.0.3,<7",
    # Offline wheel acceptance needs these in the test interpreter, including
    # Python versions whose fresh virtual environments contain only pip.
    "setuptools>=68",
    "wheel>=0.41",
]

[project.urls]
Repository = "https://github.com/nephrium83/texas-holdem"

[project.gui-scripts]
holdem = "holdem.desktop_launcher:main"
holdem-legacy-tk = "holdem.gui:main"

[tool.setuptools]
packages = ["holdem", "holdem.p2p"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: name every non-passing outcome and its reason in the run summary.
# CI runs `pytest -q`, which reports a bare "N skipped" -- and the suites
# that skip themselves when libsodium is missing are the ones carrying the
# mental-poker security properties. A count cannot tell "Godot is not
# installed" from "the entire crypto estate did not run". See
# tests/crypto_gate.py.
addopts = "-ra"
