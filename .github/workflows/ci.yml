name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTEST_TIMEOUT: "60"

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    strategy:
      # Report every version. With the default fail-fast, the first job to
      # fail cancels the rest, so a single failure hides whether the other
      # supported versions were fine -- which happened three times while
      # this matrix was first being exercised against the engine.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run engine tests
        run: pytest -q

  sidecar-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run sidecar integration tests
        run: pytest tests/test_sidecar_integration.py -v

  godot-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import Godot project (build .godot cache)
        working-directory: godot
        run: godot --headless --path . --import
      - name: Install Python deps
        run: python -m pip install -e .[dev]
      - name: Run Godot sidecar and desktop presentation integration
        run: >-
          pytest tests/test_godot_sidecar.py
          tests/test_deal_presentation_integration.py
          tests/test_lan_integration.py::test_godot_practice_menu_still_plays_ten_complete_bot_hands
          tests/test_lan_integration.py::test_godot_host_join_controls_play_three_real_lan_hands
          -v --timeout=$PYTEST_TIMEOUT
        env:
          GODOT_BIN: godot

  gui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Boot the GUI headless and play 15 hands
        run: xvfb-run -a python3 tests/gui_smoke.py

  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import project (builds .godot cache; GUT class_names load here)
        working-directory: godot
        run: godot --headless --path . --import
      - name: Run GUT tests headless
        working-directory: godot
        run: >-
          godot --headless --path .
          -s addons/gut/gut_cmdln.gd
          -gdir=res://test/unit
          -gexit
          | tee gut_output.txt
      - name: Fail if GUT produced no run summary
        working-directory: godot
        run: |
          if ! grep -q "Run Summary" gut_output.txt; then
            echo "::error::GUT did not emit a run summary - tests did not execute (likely an import/class_name failure)."
            exit 1
          fi
          if grep -qE "[1-9][0-9]* failing tests" gut_output.txt; then
            echo "::error::GUT reported failing tests."
            exit 1
          fi
          echo "GUT run summary present and no failures."

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Windows DACL and process-suspend diagnostic
        shell: pwsh
        run: |
          $code = @'
          import sys, os, ctypes, ctypes.wintypes as wt, tempfile, msvcrt, subprocess
          from pathlib import Path

          print("=== Python / platform ===")
          print("Python:", sys.version)
          print("Platform:", sys.platform)

          print()
          print("=== DACL diagnostic on a fresh temp file ===")
          from holdem.p2p.windows_security import (
              get_token_user_sid_string, get_handle_security,
              classify_leaf_dacl, free_sd, normalize_leaf_dacl,
          )
          from holdem.p2p.private_storage import _nt_open_with_write_dac, _nt_close

          fd, tmp = tempfile.mkstemp(prefix="dacl-ci-test-")
          try:
              user_sid = get_token_user_sid_string()
              print("User SID:", user_sid)
              handle = msvcrt.get_osfhandle(fd)
              owner, acl_ptr, sd_ctrl, sd_ptr = get_handle_security(handle)
              try:
                  print("File owner:", owner)
                  print("Owner == user:", owner == user_sid)
                  cls = classify_leaf_dacl(acl_ptr, user_sid, sd_ctrl)
                  print("Initial classification:", cls)
              finally:
                  free_sd(sd_ptr)
              rh, have_dac = _nt_open_with_write_dac(Path(tmp))
              print("WRITE_DAC open succeeded:", have_dac)
              if have_dac:
                  try:
                      normalize_leaf_dacl(rh, user_sid, Path(tmp))
                      print("normalize_leaf_dacl: OK")
                  except Exception as e:
                      print("normalize_leaf_dacl FAILED:", repr(e))
                  finally:
                      _nt_close(rh)
                  owner2, acl2, ctrl2, sd2 = get_handle_security(handle)
                  try:
                      cls2 = classify_leaf_dacl(acl2, user_sid, ctrl2)
                      print("Post-normalization classification:", cls2)
                  finally:
                      free_sd(sd2)
          finally:
              os.close(fd)
              try: os.unlink(tmp)
              except OSError: pass

          print()
          print("=== NtSuspendProcess / NtResumeProcess availability ===")
          ntdll = ctypes.WinDLL("ntdll")
          k32 = ctypes.WinDLL("kernel32", use_last_error=True)
          for nm in ("NtSuspendProcess", "NtResumeProcess"):
              fn = getattr(ntdll, nm, None)
              print(f"  {nm}: {'found' if fn is not None else 'NOT FOUND'}")

          print()
          print("=== Job object test: CREATE_SUSPENDED + AssignProcessToJobObject ===")
          CREATE_SUSPENDED = 0x00000004
          proc = subprocess.Popen(
              [sys.executable, "-c", "import sys; sys.exit(0)"],
              creationflags=CREATE_SUSPENDED,
          )
          print(f"  Spawned PID {proc.pid} with CREATE_SUSPENDED")
          try:
              k32.CreateJobObjectW.argtypes = [ctypes.c_void_p, wt.LPCWSTR]
              k32.CreateJobObjectW.restype = wt.HANDLE
              job = k32.CreateJobObjectW(None, None)
              print(f"  Job handle: {job!r}")
              if job:
                  k32.AssignProcessToJobObject.argtypes = [wt.HANDLE, wt.HANDLE]
                  k32.AssignProcessToJobObject.restype = wt.BOOL
                  ok = k32.AssignProcessToJobObject(job, int(proc._handle))
                  last_err = ctypes.get_last_error()
                  print(f"  AssignProcessToJobObject: ok={bool(ok)}, last_err={last_err}")
                  k32.CloseHandle.argtypes = [wt.HANDLE]
                  k32.CloseHandle.restype = wt.BOOL
                  k32.CloseHandle(job)
          finally:
              fn = getattr(ntdll, "NtResumeProcess", None)
              if fn is not None:
                  fn.argtypes = [ctypes.c_void_p]
                  fn.restype = ctypes.c_long
                  PROCESS_SUSPEND_RESUME = 0x0800
                  h = k32.OpenProcess(PROCESS_SUSPEND_RESUME, False, proc.pid)
                  if h:
                      status = fn(h)
                      k32.CloseHandle(h)
                      print(f"  NtResumeProcess status: {status:#010x}")
                  else:
                      print(f"  OpenProcess for NtResumeProcess failed: {ctypes.get_last_error()}")
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.wait()
              print(f"  Process exit code: {proc.returncode}")

          print()
          print("=== Diagnostic complete ===")
'@
          $code | python -
      - name: Verify desktop, key storage and process-test ownership
        run: >-
          python -m pytest tests/test_desktop_launcher.py
          tests/test_identity_storage.py tests/test_heartbeat_harness.py
          tests/test_heartbeat_processes.py -v --tb=long

  journal-windows:
    # The journal's access-control and durable-creation guarantees are
    # Windows-specific, so they cannot be verified by the ubuntu jobs above.
    # Only the two journal modules run here: the native crypto libraries are
    # not committed, and an unrelated red job teaches everyone to ignore it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Run journal platform tests
        shell: pwsh
        run: |
          # Discovered, not listed: naming the files here means every new journal
          # test module needs a change to this protected workflow. Collecting the
          # whole tests/ tree instead would import modules whose native crypto
          # dependencies are not committed, so the glob is the narrow middle.
          $files = @(Get-ChildItem tests/test_journal_*.py -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            Write-Host "::notice::No journal tests present yet; nothing to verify on Windows."
            exit 0
          }
          pytest -q @($files.FullName)
          exit $LASTEXITCODE
