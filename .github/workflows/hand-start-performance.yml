name: Hand-start performance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'benchmarks/**'
      - '.github/workflows/hand-start-performance.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install native crypto and harness dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium23
          python -m pip install -e '.[dev]'
      - name: Measure 20 warm hands plus first hand per configuration
        run: python benchmarks/run_hand_start.py --hands 20 --output-dir "$RUNNER_TEMP/hand-start-report"
        env:
          HOLDEM_REQUIRE_CRYPTO: '1'
      - name: Publish report to run summary
        run: cat "$RUNNER_TEMP/hand-start-report/REPORT.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve measurements and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hand-start-${{ github.sha }}
          path: ${{ runner.temp }}/hand-start-report/
          if-no-files-found: error
          retention-days: 30
